# 在六種平台上建置、測試、打包：Linux、macOS、Windows，各有 x86_64 與 arm64。
#
# 每個平台都在那個平台、那種處理器的機器上編譯並跑完測試，不是交叉編譯。產物是可以直接解開來用的下載包：
#   NBeeTv-<版本>-<平台>.tar.gz（Windows 是 .zip）  命令列工具與 models/，放在同一層；
#                                                 Windows 與 Linux 的包裡另外有桌面 app（nbtv-gui），
#                                                 Windows 的包裡還有 ffmpeg.exe（影片檔來源與存影片用，不必另外安裝）
#   NBeeTv-<版本>-macos-<處理器>-app.zip             macOS 的 NBTV.app
#   NBeeTv-<版本>-windows-ffmpeg-source.tar         Windows 的包裡那個 ffmpeg.exe 的全部原始碼（它以 GPL 發佈）
# 另外每次執行都留一份 screens-<平台>：桌面 app 在那個平台上不開視窗算出來的畫面（五種語言），用來看字型與版面對不對。
#
# 下載包裡的程式都把「同時送語音」的編解碼器（FreeDV RADE V2，-DNBTV_VOICE=ON）編進去了。它要另外取得的三份檔案
# 由 voice-sources 這個工作先抓好（見那裡的說明）。
#
# 什麼時候跑：推到 main、開 PR、手動執行時，下載包留在那一次執行的 Artifacts 裡（7 天）；
# 推版本標籤（v 開頭，例如 v0.1.0）時，另外把全部的下載包放上 GitHub Releases。
#
# macOS 的 NBTV.app：建置出來的是 ad-hoc 簽章，下載之後 macOS 會擋。推版本標籤時，另外一個工作（sign-macos）把兩份 app
# 用 Developer ID 憑證重新簽章、送 Apple 公證、釘上票據，發佈的是那一份（做法在 apps/macos/sign-and-notarize.sh）。
# 憑證與公證的登入資料放在「release-signing」這個 Environment 的 secrets 裡（名稱見 sign-macos 的說明）；
# 沒有設定的話（例如別人的 fork）那個工作什麼都不做，照舊發佈 ad-hoc 簽章的。
# 手動執行時勾選 sign 可以只試簽章與公證、不發佈：簽好的那兩份在那一次執行的 Artifacts 裡（signed-macos-apps）。
# 再填上 reuse_run（先前某一次執行的編號），就不重新建置，直接拿那一次做好的 NBTV.app 來簽，幾分鐘就知道結果
# （換了憑證、改了 sign-macos 之後用這個試）。
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: "也把 NBTV.app 用 Developer ID 簽章並送 Apple 公證（只是試，不會發佈）"
        type: boolean
        default: false
      reuse_run:
        description: "只試簽章：不重新建置，用這一次執行（填它的編號）做好的 NBTV.app；要一起勾選上面那一項"
        type: string
        default: ""

permissions:
  contents: read

# 同一個分支又推了新的提交，舊的那一次就不必跑完；版本標籤的那一次不取消。
# 只試簽章的執行（reuse_run）另外算一組：它不建置，不該把同一個分支上正在跑的建置取消掉，也不該被它取消。
concurrency:
  group: build-${{ github.ref }}${{ inputs.reuse_run && '-sign-only' || '' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # Windows 的下載包附的 ffmpeg.exe：在 Linux 上從官方的原始碼交叉編譯，只放 nbtv-gui 用得到的格式
  # （apps/desktop/ffmpeg/build-windows.sh、components.txt）。這兩個檔案沒有改的話直接用上一次建好的（快取）。
  # ffmpeg.exe 以 GPL 發佈：它的原始碼另外留一份 NBeeTv-<版本>-windows-ffmpeg-source，推版本標籤時和下載包一起放上 GitHub Releases。
  ffmpeg-windows:
    name: ffmpeg-windows-${{ matrix.arch }}
    if: ${{ !inputs.reuse_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: 原始碼那一份的名稱
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(git rev-parse --short=7 HEAD)"
          fi
          echo "SOURCE_PACKAGE=NBeeTv-$version-windows-ffmpeg-source" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        id: cache
        with:
          path: ffmpeg-out
          key: ffmpeg-windows-${{ matrix.arch }}-${{ hashFiles('apps/desktop/ffmpeg/build-windows.sh', 'apps/desktop/ffmpeg/components.txt') }}

      - name: 安裝建置要用的套件
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm meson ninja-build pkg-config

      # 原始碼與 llvm-mingw 都固定版本、核對 SHA-256；檢查做出來的是那種處理器的執行檔、只用到 Windows 本身就有的 DLL
      - name: 建置 ffmpeg.exe
        if: steps.cache.outputs.cache-hit != 'true'
        run: apps/desktop/ffmpeg/build-windows.sh "${{ matrix.arch }}" ffmpeg-out "$RUNNER_TEMP/ffmpeg-work"

      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-windows-${{ matrix.arch }}
          path: |
            ffmpeg-out/ffmpeg.exe
            ffmpeg-out/FFMPEG-LICENSE.txt
          if-no-files-found: error
          retention-days: 1

      # 兩種處理器用的原始碼相同，留 x86_64 那一份
      - name: 原始碼的那一份
        if: matrix.arch == 'x86_64'
        run: |
          mkdir -p ffmpeg-source
          cp ffmpeg-out/ffmpeg-windows-source.tar "ffmpeg-source/$SOURCE_PACKAGE.tar"
          ls -l ffmpeg-source

      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'x86_64'
        with:
          name: ${{ env.SOURCE_PACKAGE }}
          path: ffmpeg-source/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # 「同時送語音」的編解碼器要另外取得的三份檔案：rade_c 與 Opus 的原始碼、Opus 的模型資料（共約 280 MB）。
  # 版本、網址與 SHA-256 寫在 voice/cmake/sources.cmake。每次執行只抓一次、核對雜湊值，交給下面六個平台的建置用，
  # 它們設定時就不必各自再連外面的網站；那個檔沒有改的話直接用上一次抓好的（快取）。
  voice-sources:
    name: voice-sources
    if: ${{ !inputs.reuse_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: voice-sources
          key: voice-sources-${{ hashFiles('voice/cmake/sources.cmake') }}

      # 已經在資料夾裡、雜湊值也對的不會重抓
      - name: 下載並核對 SHA-256
        run: |
          cmake -DOUT=voice-sources -P voice/cmake/fetch_sources.cmake
          ls -l voice-sources

      - uses: actions/upload-artifact@v7
        with:
          name: voice-sources
          path: voice-sources/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build:
    name: ${{ matrix.target }}
    needs: [ffmpeg-windows, voice-sources]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 用 22.04 的機器建置：桌面 app 要動態連結 glibc，在比較舊的系統上建置，
          # 做出來的執行檔才能在 Ubuntu 22.04、Debian 12、Raspberry Pi OS（bookworm）以後的系統上執行。
          - target: linux-x86_64
            runner: ubuntu-22.04
            file_says: "x86-64.*static"
            gui_says: "x86-64.*dynamically"
          - target: linux-arm64
            runner: ubuntu-22.04-arm
            file_says: "aarch64.*static"
            gui_says: "aarch64.*dynamically"
          - target: macos-x86_64
            runner: macos-26-intel
            file_says: "x86_64"
          - target: macos-arm64
            runner: macos-26
            file_says: "arm64"
          - target: windows-x86_64
            runner: windows-2025
            vs_arch: x64
            ffmpeg_arch: x86_64
            file_says: "x86-64"
            gui_says: "GUI.*x86-64"
          - target: windows-arm64
            runner: windows-11-arm
            vs_arch: ARM64
            ffmpeg_arch: aarch64
            file_says: "aarch64|arm64"
            gui_says: "GUI.*(aarch64|arm64)"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: 下載包的名稱
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(git rev-parse --short=7 HEAD)"
          fi
          echo "PACKAGE=NBeeTv-$version-${{ matrix.target }}" >> "$GITHUB_ENV"

      # Linux 上建置桌面 app（nbtv-gui）要的東西：SDL 要各種視窗、音訊系統的標頭檔才會把對應的功能編進去
      # （X11、Wayland、ALSA、PulseAudio、PipeWire、輸入法…；執行時系統上有哪一個就用哪一個，都不是必要的）。
      # 另外是檢查時要用的：假的螢幕（xvfb）、字型、ffmpeg、Hamlib。
      - name: Linux：安裝建置與檢查要用的套件
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-12 pkg-config binutils \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libdbus-1-dev libudev-dev libibus-1.0-dev \
            xvfb xauth fontconfig fonts-dejavu-core fonts-noto-cjk ffmpeg libhamlib-utils

      # Windows 的下載包附上 ffmpeg.exe（上面的 ffmpeg-windows 建置的），放在 nbtv-gui.exe 旁邊。
      # 下面的檢查用的也是它，不另外安裝別的 ffmpeg。
      - name: Windows：拿要附在下載包裡的 ffmpeg
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-windows-${{ matrix.ffmpeg_arch }}
          path: ${{ runner.temp }}/ffmpeg-bundle

      # 語音的編解碼器要的三份檔案（上面的 voice-sources 抓好、核對過的）；設定時用 NBTV_VOICE_SOURCES 指過去
      - name: 拿語音編解碼器的原始碼
        uses: actions/download-artifact@v8
        with:
          name: voice-sources
          path: ${{ runner.temp }}/voice-sources

      # Linux：命令列工具整個靜態連結，不挑發行版與 glibc 的版本；桌面 app 只把 C++ 的執行階段連進去（見 apps/desktop/CMakeLists.txt）。
      # macOS：命令列工具最低支援 macOS 11（NBTV.app 另外設定，見下面）。
      # Windows：C 執行階段靜態連結，使用者不必另外裝 Visual C++ 的可轉散發套件。
      # 桌面 app 用到的 SDL、Dear ImGui、stb 在這一步下載（版本固定，核對 SHA-256）。
      # 語音的編解碼器（rade_c 與 Opus）也在這一步解開，和專案一起編譯（voice/CMakeLists.txt）。
      - name: 設定
        run: |
          voice=(-DNBTV_VOICE=ON -DNBTV_VOICE_SOURCES="$RUNNER_TEMP/voice-sources")
          case "$RUNNER_OS" in
            Linux)
              cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNBTV_INSTALL_FLAT=ON \
                -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 \
                -DNBTV_STATIC_TOOLS=ON -DNBTV_BUILD_DESKTOP_APP=ON "${voice[@]}" ;;
            macOS)
              cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNBTV_INSTALL_FLAT=ON \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 "${voice[@]}" ;;
            Windows)
              cmake -S . -B build -A "${{ matrix.vs_arch }}" -DNBTV_INSTALL_FLAT=ON \
                -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DNBTV_BUILD_DESKTOP_APP=ON \
                -DNBTV_DESKTOP_BUNDLED_FFMPEG="$RUNNER_TEMP/ffmpeg-bundle" "${voice[@]}" ;;
          esac

      - name: 建置
        run: cmake --build build --config Release --parallel

      # macOS 的 app：另外一個建置目錄（Swift 要用 Ninja），最低支援 macOS 14。排在測試之前：編不過的話早一點知道。
      # 簽章是 ad-hoc 的（沒有 Apple 的開發者憑證，也沒有公證），使用者第一次開啟要自己放行，README 有寫。
      - name: 建置 NBTV.app
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build-app -G Ninja -DCMAKE_BUILD_TYPE=Release -DNBTV_BUILD_MACOS_APP=ON \
            -DNBTV_BUILD_TESTS=OFF -DNBTV_BUILD_TOOLS=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DNBTV_VOICE=ON -DNBTV_VOICE_SOURCES="$RUNNER_TEMP/voice-sources"
          cmake --build build-app
          app=build-app/apps/macos/NBTV.app
          codesign --verify --deep --strict --verbose=2 "$app"
          file "$app/Contents/MacOS/NBTV"
          file "$app/Contents/MacOS/NBTV" | grep -i -E -q "${{ matrix.file_says }}"

      - name: 測試
        run: ctest --test-dir build -C Release --output-on-failure --parallel 4 --timeout 2400

      # 做出下載包：先裝到一個目錄，再壓縮。接下來的檢查都對著「壓縮檔解開之後」的那一份做，
      # 也就是使用者真正會拿到的東西。
      - name: 打包
        run: |
          cmake --install build --config Release --prefix "dist/$PACKAGE"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -E tar cf "$PACKAGE.zip" --format=zip "$PACKAGE"
          else
            tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
          fi
          rm -rf "$PACKAGE"
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -c -k --keepParent ../build-app/apps/macos/NBTV.app "$PACKAGE-app.zip"
          fi
          ls -l

      # 把壓縮檔解開到別的目錄，並且把專案自己的 models/ 藏起來：這時工具只找得到自己旁邊的權重檔。
      # 下載包的名稱說是哪一種處理器，裡面的執行檔就要真的是那一種（Linux 另外要是靜態連結的）。
      # 檔名刻意用中文，Windows 上也要開得了。
      - name: 解開下載包，只靠它收發一次
        run: |
          work="$RUNNER_TEMP/試用 trial"
          mkdir -p "$work"
          cp core/tests/data/cat.ppm "$work/貓.ppm"
          cp core/tests/data/coffee.ppm core/tests/data/rocket.ppm "$work/"
          cp build/_deps/rade_c-src/input_sample.wav "$work/說話.wav"
          archive="$PWD/dist/$PACKAGE"
          mv models models.hidden
          trap 'mv "$GITHUB_WORKSPACE/models.hidden" "$GITHUB_WORKSPACE/models"' EXIT
          cd "$work"
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -E tar xf "$archive.zip"
            exe=.exe
          else
            tar -xzf "$archive.tar.gz"
            exe=
          fi
          tools="./$PACKAGE"
          ls -l "$tools" "$tools/models"
          file "$tools/nbtv-rx$exe"
          file "$tools/nbtv-rx$exe" | grep -i -E -q "${{ matrix.file_says }}"
          "$tools/nbtv-tx" --mode 14 --call N0CALL --out 發射.wav 貓.ppm coffee.ppm rocket.ppm
          "$tools/nbtv-chan" --channel awgn --snr 12 --offset 37 --ppm 40 發射.wav 收到.wav
          "$tools/nbtv-rx" --json --merge --out-dir . 收到.wav | tee rx.json
          grep -q '"callsign":"N0CALL"' rx.json
          grep -q '"end":true,"frames":3,"pictures":3' rx.json
          test -s frame_2.ppm
          "$tools/nbtv-sim" --mode 12 --channel poor --snr 10 --frames 8 --image 貓.ppm
          "$tools/nbtv-learned" --mode 13 --snr 10 貓.ppm coffee.ppm
          # 語音與畫面共用一個 FM 語音通道：一段語音（rade_c 附的）編成訊號、和三張畫面合成一個音檔，
          # 再分成兩路各自解回來。語音的編解碼器連進了執行檔，它的授權條文要在包裡。
          "$tools/nbtv-voice" info | tee voice-info.txt
          grep -q "RADE" voice-info.txt
          grep -q "rade_c" "$tools/THIRD-PARTY-LICENSES.txt"
          "$tools/nbtv-voice" encode 說話.wav 語音.iq
          "$tools/nbtv-tx" --mode 3 --call N0CALL --rate 12000 --out 畫面.wav 貓.ppm coffee.ppm rocket.ppm
          "$tools/nbtv-duplex" mux --picture 畫面.wav --voice 語音.iq --out 合成.wav
          "$tools/nbtv-duplex" demux --picture 收到的畫面.wav --voice 收到的語音.iq 合成.wav
          mkdir 一起送
          "$tools/nbtv-rx" --json --band-shift 1650.5 --out-dir 一起送 收到的畫面.wav | tee duplex.json
          grep -q '"callsign":"N0CALL"' duplex.json
          grep -q '"end":true,"frames":3,"pictures":3' duplex.json
          "$tools/nbtv-voice" decode 收到的語音.iq 解出的語音.wav | tee voice.txt
          grep -q "收到「結束」的標記 1 次" voice.txt

      # 桌面 app（Windows、Linux）也一樣對著解開的那一份做，都不碰真的音訊裝置與鏡頭：
      #   1. 自我測試：收發的流程、PTT、檔案來源、定時發射、介面的每個按鈕……音訊走 SDL 的「假」驅動（走的是和真的裝置一樣的程式）；
      #   2. 不開視窗把六張畫面各算成一張圖，五種語言都算（留在 Artifacts 裡，看得到這個平台上的字型與版面）；
      #      另外多算給 FM 用的大畫面（192×144）那三張：接收中、模式選單、發射中；
      #   3. 真的開視窗幾秒鐘：示範資料兩次（一般的，與給 FM 用的 192×144 大畫面），再照平常的方式啟動一次
      #      （Linux 的機器沒有螢幕，用 xvfb 給一個假的）。
      # Windows 另外檢查包裡附的 ffmpeg.exe：是那種處理器的、app 用的就是它（--version 印出來的路徑），
      # 讀得了各種格式的影片、存得了影片（apps/desktop/ffmpeg/check.sh）。自我測試裡影片檔來源與存影片的項目也不准略過。
      # Linux 的包不附 ffmpeg，用的是機器上 apt 裝的。
      # 「同時送語音」那一項也不准略過：編解碼器要真的編進去了，發射、接收、開關都走一遍。
      # 視窗程式在 Windows 上沒有主控台可以印字，所以結果一律另外寫進檔案（--report）再印出來。
      - name: 解開下載包，跑桌面 app 的檢查
        if: runner.os != 'macOS'
        run: |
          work="$RUNNER_TEMP/桌面 gui"
          mkdir -p "$work" "$GITHUB_WORKSPACE/screens"
          archive="$PWD/dist/$PACKAGE"
          checker="$PWD/apps/desktop/ffmpeg/check.sh"
          mv models models.hidden
          trap 'mv "$GITHUB_WORKSPACE/models.hidden" "$GITHUB_WORKSPACE/models"' EXIT
          cd "$work"
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -E tar xf "$archive.zip"
            exe=.exe
            window=
            require=cjk,fonts,audio,ffmpeg,voice
          else
            tar -xzf "$archive.tar.gz"
            exe=
            window="xvfb-run -a"
            require=cjk,fonts,audio,ffmpeg,hamlib,voice
          fi
          gui="./$PACKAGE/nbtv-gui$exe"
          test -s "./$PACKAGE/THIRD-PARTY-LICENSES.txt"
          grep -q "rade_c" "./$PACKAGE/THIRD-PARTY-LICENSES.txt"
          file "$gui"
          file "$gui" | grep -i -E -q "${{ matrix.gui_says }}"
          if [ "$RUNNER_OS" = Linux ]; then
            # 只能直接相依 glibc：視窗、音訊的函式庫都是執行時才載入的，系統上沒有也要開得起來
            objdump -p "$gui" | grep NEEDED
            if objdump -p "$gui" | grep NEEDED | grep -v -E 'lib(c|m|dl|pthread|rt)\.so\.|ld-linux'; then
              echo "::error::nbtv-gui 直接相依了 glibc 以外的函式庫"
              exit 1
            fi
            echo "需要的 glibc 版本：$(objdump -T "$gui" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)"
          fi
          # 執行一次，把它寫進 --report 的內容印出來（沒有寫的話印標準輸出），結束碼照它的
          run() {
            local name="$1" status=0
            shift
            "$@" --report "$name.log" > "$name.out" 2>&1 || status=$?
            if [ -s "$name.log" ]; then cat "$name.log"; else cat "$name.out"; fi
            return $status
          }
          export SDL_AUDIODRIVER=dummy SDL_AUDIO_DRIVER=dummy
          run version "$gui" --version
          grep -q "nbtv-gui" version.log
          if [ "$RUNNER_OS" = Windows ]; then
            ffmpeg="./$PACKAGE/ffmpeg.exe"
            test -s "./$PACKAGE/FFMPEG-LICENSE.txt"
            file "$ffmpeg"
            file "$ffmpeg" | grep -i -E -q "${{ matrix.file_says }}"
            grep -E "ffmpeg：.*$PACKAGE[\\/]ffmpeg\.exe" version.log
            bash "$checker" "$ffmpeg" "$work/ffmpeg-check"
          fi
          NBTV_SELFTEST_REQUIRE=$require run selftest "$gui" --selftest --work "$work/selftest"
          NBTV_SNAPSHOT_FM=1 run snapshot "$gui" --snapshot "$GITHUB_WORKSPACE/screens" --lang all
          test -s "$GITHUB_WORKSPACE/screens/en/1-receiving.png"
          test -s "$GITHUB_WORKSPACE/screens/en/extra-fm-receiving.png"
          run demo $window "$gui" --demo --quit-after 3
          grep -q "畫了" demo.log
          NBTV_SNAPSHOT_FM=1 run demo-fm $window "$gui" --demo --quit-after 3
          grep -q "畫了" demo-fm.log
          run live $window "$gui" --settings "$work/settings.txt" --quit-after 5
          grep -q "畫了" live.log
          test -s "$work/settings.txt"

      - uses: actions/upload-artifact@v7
        if: runner.os != 'macOS' && !cancelled()
        with:
          name: screens-${{ matrix.target }}
          path: screens
          if-no-files-found: warn
          retention-days: 7

      # NBTV.app 也一樣：把壓縮檔解開到別的目錄，確認簽章還在，再跑 app 自己的檢查——模型、核心收發、存檔、
      # 影片來源、定時發射、翻譯……都不碰音訊裝置與鏡頭。「同時送語音」那一項要是「通過」（沒有把編解碼器編進去的話
      # 會是「略過」），它用到的兩份程式的授權條文要在 app 裡。
      - name: 解開 NBTV.app，跑它的自我測試
        if: runner.os == 'macOS'
        run: |
          work="$RUNNER_TEMP/app trial"
          mkdir -p "$work"
          ditto -x -k "dist/$PACKAGE-app.zip" "$work"
          codesign --verify --deep --strict --verbose=2 "$work/NBTV.app"
          "$work/NBTV.app/Contents/MacOS/NBTV" --selftest --no-devices 2>&1 | tee "$work/selftest.txt"
          grep -q "同時送語音：發射、接收、開關：通過" "$work/selftest.txt"
          test -s "$work/NBTV.app/Contents/Resources/rade_c-LICENSE.txt"
          test -s "$work/NBTV.app/Contents/Resources/opus-COPYING.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # macOS 的 NBTV.app 的簽章與公證。推版本標籤時跑；手動執行並勾選 sign 時也跑（用來試，不發佈）。
  # 兩份 app（x86_64 與 arm64）都在這一台 arm64 的機器上處理：簽章與公證和處理器無關，程式本身不重新編譯。
  #
  # 用到的 secrets 都放在「release-signing」這個 Environment 裡（Settings → Environments；建議限制只有 v* 標籤與 main 能用）：
  #   MACOS_CERTIFICATE_P12        Developer ID Application 憑證連同私鑰匯出的 .p12，轉成 base64（base64 -i 檔名.p12）
  #   MACOS_CERTIFICATE_PASSWORD   匯出 .p12 時設的密碼
  # 公證的登入方式二選一：
  #   NOTARY_KEY_P8、NOTARY_KEY_ID、NOTARY_ISSUER    App Store Connect 的 API 金鑰（.p8 的內容或它的 base64；個人金鑰不給 NOTARY_ISSUER）
  #   NOTARY_APPLE_ID、NOTARY_TEAM_ID、NOTARY_PASSWORD   Apple ID、Team ID 與 App 專用密碼（不是帳號的密碼）
  # 沒有設定 MACOS_CERTIFICATE_P12 的話這個工作什麼都不做（別人的 fork 就是這樣），發佈的仍然是 ad-hoc 簽章的 app。
  # 簽章身分的名稱不會印在紀錄裡（紀錄是公開的）。
  # 平常要等 build 成功；手動執行填了 reuse_run 時 build 被略過，改拿那一次執行的產物。
  sign-macos:
    name: sign-macos
    if: >-
      ${{ !cancelled()
          && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.reuse_run))
          && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.sign)) }}
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    environment: release-signing
    permissions:
      contents: read
      actions: read   # 拿別次執行的產物（reuse_run）要這一項
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    env:
      HAVE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        if: ${{ !inputs.reuse_run }}
        with:
          path: packages
          pattern: NBeeTv-*-macos-*
          merge-multiple: true

      # 只試簽章時：拿指定的那一次執行做好的
      - uses: actions/download-artifact@v8
        if: ${{ inputs.reuse_run }}
        with:
          path: packages
          pattern: NBeeTv-*-macos-*
          merge-multiple: true
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}

      - name: 沒有設定憑證
        if: env.HAVE_CERTIFICATE != 'true'
        run: echo "::notice::release-signing 裡沒有 MACOS_CERTIFICATE_P12：NBTV.app 維持 ad-hoc 簽章，沒有公證。"

      # 憑證放進一個只在這次執行存在的鑰匙圈。Apple 的中繼憑證也放進去（機器上不一定有，少了它 codesign 接不出完整的憑證鏈）：
      # G1 是 2027-02-01 到期的舊中繼憑證，G2 是現在的。這兩個檔案不核對 SHA-256，和這份流程別處下載的東西不一樣——
      # 它們只用來接憑證鏈，鏈要能一路驗到系統內建的 Apple 根憑證才算數，拿到別的檔案只會簽不出來。
      - name: 匯入憑證
        if: env.HAVE_CERTIFICATE == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # 匯入一個檔案。「已經在鑰匙圈裡了」不算錯：匯出的 .p12 可能連中繼憑證一起帶著，下面再放一次就會遇到。
          # security 平常印的內容（裡面有憑證的名稱）不留在紀錄裡，只有真的出錯時才印它的錯誤訊息。
          import() {
            local output
            if ! output="$(security import "$@" 2>&1)"; then
              case "$output" in
                *"already exists"*) ;;
                *) echo "$output" >&2; return 1 ;;
              esac
            fi
          }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "憑證與私鑰：匯入了"
          for file in DeveloperIDCA.cer DeveloperIDG2CA.cer; do
            curl -fsSL --retry 3 "https://www.apple.com/certificateauthority/$file" -o "$RUNNER_TEMP/$file"
            import "$RUNNER_TEMP/$file" -k "$keychain"
            echo "中繼憑證 ${file}：在鑰匙圈裡了"
          done
          # 讓 codesign 不必經過詢問視窗就能用這把私鑰
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          # 加進搜尋清單，原來的留著
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//')
          # 只印幾個、不印名稱：「identities found」是有幾組憑證＋私鑰，「valid identities found」是其中憑證鏈驗得過、沒過期的
          security find-identity -p codesigning "$keychain" | grep -E "identities found$" | sed -e 's/^ *//' || true
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 裡沒有可以用的 Developer ID Application 身分（憑證過期、少了私鑰，或密碼不對）"
            exit 1
          fi
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: 簽章、公證、釘上票據
        id: sign
        if: env.HAVE_CERTIFICATE == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          export NBTV_SIGN_IDENTITY="$SIGN_IDENTITY" NBTV_SIGN_KEYCHAIN="$SIGN_KEYCHAIN"
          if [ -n "$NOTARY_KEY_P8" ]; then
            # API 金鑰：secret 裡放的是 .p8 的內容，或它的 base64
            case "$NOTARY_KEY_P8" in
              -----BEGIN*) printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8" ;;
              *) echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary-key.p8" ;;
            esac
            export NBTV_NOTARY_KEY="$RUNNER_TEMP/notary-key.p8" NBTV_NOTARY_KEY_ID="$NOTARY_KEY_ID" NBTV_NOTARY_ISSUER="$NOTARY_ISSUER"
          else
            export NBTV_NOTARY_APPLE_ID="$NOTARY_APPLE_ID" NBTV_NOTARY_TEAM_ID="$NOTARY_TEAM_ID" NBTV_NOTARY_PASSWORD="$NOTARY_PASSWORD"
            # 這三項設定的時候看不到自己打的字，最容易出錯。登入失敗時 Apple 只說「帳號或密碼不對」，
            # 所以這裡先看一下樣子（不印內容）：哪一項看起來不對就提醒，方便知道該重設哪一個。
            case "$NOTARY_APPLE_ID" in
              *[[:space:]]*) echo "::warning::NOTARY_APPLE_ID 裡有空白字元" ;;
              *@*.*) ;;
              *) echo "::warning::NOTARY_APPLE_ID 看起來不像 Apple ID（應該是一個信箱）" ;;
            esac
            case "$NOTARY_PASSWORD" in
              *[[:space:]]*) echo "::warning::NOTARY_PASSWORD 裡有空白或換行" ;;
              [a-z][a-z][a-z][a-z]-[a-z][a-z][a-z][a-z]-[a-z][a-z][a-z][a-z]-[a-z][a-z][a-z][a-z]) ;;
              *) echo "::warning::NOTARY_PASSWORD 的樣子不像 App 專用密碼（應該是 xxxx-xxxx-xxxx-xxxx：四組、每組四個小寫字母）" ;;
            esac
            team="$(security find-certificate -c "Developer ID Application" -p "$SIGN_KEYCHAIN" | openssl x509 -noout -subject -nameopt multiline | awk -F'= ' '/organizationalUnitName/ { print $2 }')"
            if [ "$team" != "$NOTARY_TEAM_ID" ]; then
              echo "::warning::NOTARY_TEAM_ID 和憑證上的 Team ID 不一樣（或是裡面多了空白、換行）"
            fi
          fi
          mkdir -p signed
          count=0
          for zip in packages/*-app.zip; do
            name="$(basename "$zip")"
            work="$RUNNER_TEMP/unsigned/$name"
            mkdir -p "$work"
            ditto -x -k "$zip" "$work"
            apps/macos/sign-and-notarize.sh "$work/NBTV.app" "signed/$name"
            count=$((count + 1))
          done
          rm -f "$RUNNER_TEMP/notary-key.p8"
          if [ "$count" -ne 2 ]; then
            echo "::error::應該有兩份 NBTV.app（x86_64 與 arm64），找到 $count 份"
            exit 1
          fi
          ls -l signed
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # 對著「使用者會拿到的那個 zip」再檢查一次：解開、簽章有效、票據釘著。arm64 的那一份在這台機器上跑它的自我測試
      # （和建置時跑的一樣，不碰音訊裝置與鏡頭），確認開了 Hardened Runtime、換了簽章之後照樣能用。
      - name: 解開簽過的 NBTV.app 再檢查
        if: steps.sign.outputs.signed == 'true'
        run: |
          for zip in signed/*-app.zip; do
            work="$RUNNER_TEMP/signed trial/$(basename "$zip" .zip)"
            mkdir -p "$work"
            ditto -x -k "$zip" "$work"
            codesign --verify --deep --strict --verbose=2 "$work/NBTV.app"
            xcrun stapler validate "$work/NBTV.app"
            case "$zip" in
              *-arm64-app.zip) "$work/NBTV.app/Contents/MacOS/NBTV" --selftest --no-devices ;;
            esac
          done

      - uses: actions/upload-artifact@v7
        if: steps.sign.outputs.signed == 'true'
        with:
          name: signed-macos-apps
          path: signed/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: 刪掉暫時的鑰匙圈
        if: always() && env.HAVE_CERTIFICATE == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  # 推版本標籤時：把六個平台的下載包、Windows 的包裡那個 ffmpeg.exe 的原始碼，與一份 SHA-256 清單放上 GitHub Releases。
  # macOS 的 NBTV.app 用 sign-macos 簽過、公證過的那兩份；那個工作失敗的話不發佈。
  release:
    name: release
    if: github.ref_type == 'tag'
    needs: [build, sign-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: NBeeTv-*
          merge-multiple: true

      # 簽過、公證過的 NBTV.app 取代建置時 ad-hoc 簽章的那兩份（檔名相同）。沒有設定憑證時沒有這一份，照舊發佈 ad-hoc 的。
      - uses: actions/download-artifact@v8
        if: needs.sign-macos.outputs.signed == 'true'
        with:
          name: signed-macos-apps
          path: signed

      - name: 換成簽過的 NBTV.app
        if: needs.sign-macos.outputs.signed == 'true'
        run: |
          for zip in signed/*-app.zip; do
            test -f "dist/$(basename "$zip")"
            cp -fv "$zip" dist/
          done

      - name: SHA-256 清單
        run: |
          cd dist
          sha256sum NBeeTv-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 發佈
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "NBeeTv ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
          fi
