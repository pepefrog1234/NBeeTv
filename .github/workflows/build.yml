# 在六種平台上建置、測試、打包：Linux、macOS、Windows，各有 x86_64 與 arm64。
#
# 每個平台都在那個平台、那種處理器的機器上編譯並跑完測試，不是交叉編譯。產物是可以直接解開來用的下載包：
#   NBeeTv-<版本>-<平台>.tar.gz（Windows 是 .zip）  命令列工具與 models/，放在同一層；
#                                                 Windows 與 Linux 的包裡另外有桌面 app（nbtv-gui），
#                                                 Windows 的包裡還有 ffmpeg.exe（影片檔來源與存影片用，不必另外安裝）
#   NBeeTv-<版本>-macos-<處理器>-app.zip             macOS 的 NBTV.app
#   NBeeTv-<版本>-windows-ffmpeg-source.tar         Windows 的包裡那個 ffmpeg.exe 的全部原始碼（它以 GPL 發佈）
# 另外每次執行都留一份 screens-<平台>：桌面 app 在那個平台上不開視窗算出來的畫面（五種語言），用來看字型與版面對不對。
#
# 什麼時候跑：推到 main、開 PR、手動執行時，下載包留在那一次執行的 Artifacts 裡（7 天）；
# 推版本標籤（v 開頭，例如 v0.1.0）時，另外把全部的下載包放上 GitHub Releases。
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一個分支又推了新的提交，舊的那一次就不必跑完；版本標籤的那一次不取消。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # Windows 的下載包附的 ffmpeg.exe：在 Linux 上從官方的原始碼交叉編譯，只放 nbtv-gui 用得到的格式
  # （apps/desktop/ffmpeg/build-windows.sh、components.txt）。這兩個檔案沒有改的話直接用上一次建好的（快取）。
  # ffmpeg.exe 以 GPL 發佈：它的原始碼另外留一份 NBeeTv-<版本>-windows-ffmpeg-source，推版本標籤時和下載包一起放上 GitHub Releases。
  ffmpeg-windows:
    name: ffmpeg-windows-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: 原始碼那一份的名稱
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(git rev-parse --short=7 HEAD)"
          fi
          echo "SOURCE_PACKAGE=NBeeTv-$version-windows-ffmpeg-source" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        id: cache
        with:
          path: ffmpeg-out
          key: ffmpeg-windows-${{ matrix.arch }}-${{ hashFiles('apps/desktop/ffmpeg/build-windows.sh', 'apps/desktop/ffmpeg/components.txt') }}

      - name: 安裝建置要用的套件
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm meson ninja-build pkg-config

      # 原始碼與 llvm-mingw 都固定版本、核對 SHA-256；檢查做出來的是那種處理器的執行檔、只用到 Windows 本身就有的 DLL
      - name: 建置 ffmpeg.exe
        if: steps.cache.outputs.cache-hit != 'true'
        run: apps/desktop/ffmpeg/build-windows.sh "${{ matrix.arch }}" ffmpeg-out "$RUNNER_TEMP/ffmpeg-work"

      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-windows-${{ matrix.arch }}
          path: |
            ffmpeg-out/ffmpeg.exe
            ffmpeg-out/FFMPEG-LICENSE.txt
          if-no-files-found: error
          retention-days: 1

      # 兩種處理器用的原始碼相同，留 x86_64 那一份
      - name: 原始碼的那一份
        if: matrix.arch == 'x86_64'
        run: |
          mkdir -p ffmpeg-source
          cp ffmpeg-out/ffmpeg-windows-source.tar "ffmpeg-source/$SOURCE_PACKAGE.tar"
          ls -l ffmpeg-source

      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'x86_64'
        with:
          name: ${{ env.SOURCE_PACKAGE }}
          path: ffmpeg-source/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build:
    name: ${{ matrix.target }}
    needs: ffmpeg-windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 用 22.04 的機器建置：桌面 app 要動態連結 glibc，在比較舊的系統上建置，
          # 做出來的執行檔才能在 Ubuntu 22.04、Debian 12、Raspberry Pi OS（bookworm）以後的系統上執行。
          - target: linux-x86_64
            runner: ubuntu-22.04
            file_says: "x86-64.*static"
            gui_says: "x86-64.*dynamically"
          - target: linux-arm64
            runner: ubuntu-22.04-arm
            file_says: "aarch64.*static"
            gui_says: "aarch64.*dynamically"
          - target: macos-x86_64
            runner: macos-26-intel
            file_says: "x86_64"
          - target: macos-arm64
            runner: macos-26
            file_says: "arm64"
          - target: windows-x86_64
            runner: windows-2025
            vs_arch: x64
            ffmpeg_arch: x86_64
            file_says: "x86-64"
            gui_says: "GUI.*x86-64"
          - target: windows-arm64
            runner: windows-11-arm
            vs_arch: ARM64
            ffmpeg_arch: aarch64
            file_says: "aarch64|arm64"
            gui_says: "GUI.*(aarch64|arm64)"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: 下載包的名稱
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(git rev-parse --short=7 HEAD)"
          fi
          echo "PACKAGE=NBeeTv-$version-${{ matrix.target }}" >> "$GITHUB_ENV"

      # Linux 上建置桌面 app（nbtv-gui）要的東西：SDL 要各種視窗、音訊系統的標頭檔才會把對應的功能編進去
      # （X11、Wayland、ALSA、PulseAudio、PipeWire、輸入法…；執行時系統上有哪一個就用哪一個，都不是必要的）。
      # 另外是檢查時要用的：假的螢幕（xvfb）、字型、ffmpeg、Hamlib。
      - name: Linux：安裝建置與檢查要用的套件
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-12 pkg-config binutils \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libdbus-1-dev libudev-dev libibus-1.0-dev \
            xvfb xauth fontconfig fonts-dejavu-core fonts-noto-cjk ffmpeg libhamlib-utils

      # Windows 的下載包附上 ffmpeg.exe（上面的 ffmpeg-windows 建置的），放在 nbtv-gui.exe 旁邊。
      # 下面的檢查用的也是它，不另外安裝別的 ffmpeg。
      - name: Windows：拿要附在下載包裡的 ffmpeg
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-windows-${{ matrix.ffmpeg_arch }}
          path: ${{ runner.temp }}/ffmpeg-bundle

      # Linux：命令列工具整個靜態連結，不挑發行版與 glibc 的版本；桌面 app 只把 C++ 的執行階段連進去（見 apps/desktop/CMakeLists.txt）。
      # macOS：命令列工具最低支援 macOS 11（NBTV.app 另外設定，見下面）。
      # Windows：C 執行階段靜態連結，使用者不必另外裝 Visual C++ 的可轉散發套件。
      # 桌面 app 用到的 SDL、Dear ImGui、stb 在這一步下載（版本固定，核對 SHA-256）。
      - name: 設定
        run: |
          case "$RUNNER_OS" in
            Linux)
              cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNBTV_INSTALL_FLAT=ON \
                -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 \
                -DNBTV_STATIC_TOOLS=ON -DNBTV_BUILD_DESKTOP_APP=ON ;;
            macOS)
              cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNBTV_INSTALL_FLAT=ON \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 ;;
            Windows)
              cmake -S . -B build -A "${{ matrix.vs_arch }}" -DNBTV_INSTALL_FLAT=ON \
                -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DNBTV_BUILD_DESKTOP_APP=ON \
                -DNBTV_DESKTOP_BUNDLED_FFMPEG="$RUNNER_TEMP/ffmpeg-bundle" ;;
          esac

      - name: 建置
        run: cmake --build build --config Release --parallel

      # macOS 的 app：另外一個建置目錄（Swift 要用 Ninja），最低支援 macOS 14。排在測試之前：編不過的話早一點知道。
      # 簽章是 ad-hoc 的（沒有 Apple 的開發者憑證，也沒有公證），使用者第一次開啟要自己放行，README 有寫。
      - name: 建置 NBTV.app
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build-app -G Ninja -DCMAKE_BUILD_TYPE=Release -DNBTV_BUILD_MACOS_APP=ON \
            -DNBTV_BUILD_TESTS=OFF -DNBTV_BUILD_TOOLS=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          cmake --build build-app
          app=build-app/apps/macos/NBTV.app
          codesign --verify --deep --strict --verbose=2 "$app"
          file "$app/Contents/MacOS/NBTV"
          file "$app/Contents/MacOS/NBTV" | grep -i -E -q "${{ matrix.file_says }}"

      - name: 測試
        run: ctest --test-dir build -C Release --output-on-failure --parallel 4 --timeout 2400

      # 做出下載包：先裝到一個目錄，再壓縮。接下來的檢查都對著「壓縮檔解開之後」的那一份做，
      # 也就是使用者真正會拿到的東西。
      - name: 打包
        run: |
          cmake --install build --config Release --prefix "dist/$PACKAGE"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -E tar cf "$PACKAGE.zip" --format=zip "$PACKAGE"
          else
            tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
          fi
          rm -rf "$PACKAGE"
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -c -k --keepParent ../build-app/apps/macos/NBTV.app "$PACKAGE-app.zip"
          fi
          ls -l

      # 把壓縮檔解開到別的目錄，並且把專案自己的 models/ 藏起來：這時工具只找得到自己旁邊的權重檔。
      # 下載包的名稱說是哪一種處理器，裡面的執行檔就要真的是那一種（Linux 另外要是靜態連結的）。
      # 檔名刻意用中文，Windows 上也要開得了。
      - name: 解開下載包，只靠它收發一次
        run: |
          work="$RUNNER_TEMP/試用 trial"
          mkdir -p "$work"
          cp core/tests/data/cat.ppm "$work/貓.ppm"
          cp core/tests/data/coffee.ppm core/tests/data/rocket.ppm "$work/"
          archive="$PWD/dist/$PACKAGE"
          mv models models.hidden
          trap 'mv "$GITHUB_WORKSPACE/models.hidden" "$GITHUB_WORKSPACE/models"' EXIT
          cd "$work"
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -E tar xf "$archive.zip"
            exe=.exe
          else
            tar -xzf "$archive.tar.gz"
            exe=
          fi
          tools="./$PACKAGE"
          ls -l "$tools" "$tools/models"
          file "$tools/nbtv-rx$exe"
          file "$tools/nbtv-rx$exe" | grep -i -E -q "${{ matrix.file_says }}"
          "$tools/nbtv-tx" --mode 14 --call N0CALL --out 發射.wav 貓.ppm coffee.ppm rocket.ppm
          "$tools/nbtv-chan" --channel awgn --snr 12 --offset 37 --ppm 40 發射.wav 收到.wav
          "$tools/nbtv-rx" --json --merge --out-dir . 收到.wav | tee rx.json
          grep -q '"callsign":"N0CALL"' rx.json
          grep -q '"end":true,"frames":3,"pictures":3' rx.json
          test -s frame_2.ppm
          "$tools/nbtv-sim" --mode 12 --channel poor --snr 10 --frames 8 --image 貓.ppm
          "$tools/nbtv-learned" --mode 13 --snr 10 貓.ppm coffee.ppm

      # 桌面 app（Windows、Linux）也一樣對著解開的那一份做，都不碰真的音訊裝置與鏡頭：
      #   1. 自我測試：收發的流程、PTT、檔案來源、定時發射、介面的每個按鈕……音訊走 SDL 的「假」驅動（走的是和真的裝置一樣的程式）；
      #   2. 不開視窗把六張畫面各算成一張圖，五種語言都算（留在 Artifacts 裡，看得到這個平台上的字型與版面）；
      #      另外多算給 FM 用的大畫面（192×144）那三張：接收中、模式選單、發射中；
      #   3. 真的開視窗幾秒鐘：示範資料兩次（一般的，與給 FM 用的 192×144 大畫面），再照平常的方式啟動一次
      #      （Linux 的機器沒有螢幕，用 xvfb 給一個假的）。
      # Windows 另外檢查包裡附的 ffmpeg.exe：是那種處理器的、app 用的就是它（--version 印出來的路徑），
      # 讀得了各種格式的影片、存得了影片（apps/desktop/ffmpeg/check.sh）。自我測試裡影片檔來源與存影片的項目也不准略過。
      # Linux 的包不附 ffmpeg，用的是機器上 apt 裝的。
      # 視窗程式在 Windows 上沒有主控台可以印字，所以結果一律另外寫進檔案（--report）再印出來。
      - name: 解開下載包，跑桌面 app 的檢查
        if: runner.os != 'macOS'
        run: |
          work="$RUNNER_TEMP/桌面 gui"
          mkdir -p "$work" "$GITHUB_WORKSPACE/screens"
          archive="$PWD/dist/$PACKAGE"
          checker="$PWD/apps/desktop/ffmpeg/check.sh"
          mv models models.hidden
          trap 'mv "$GITHUB_WORKSPACE/models.hidden" "$GITHUB_WORKSPACE/models"' EXIT
          cd "$work"
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -E tar xf "$archive.zip"
            exe=.exe
            window=
            require=cjk,fonts,audio,ffmpeg
          else
            tar -xzf "$archive.tar.gz"
            exe=
            window="xvfb-run -a"
            require=cjk,fonts,audio,ffmpeg,hamlib
          fi
          gui="./$PACKAGE/nbtv-gui$exe"
          test -s "./$PACKAGE/THIRD-PARTY-LICENSES.txt"
          file "$gui"
          file "$gui" | grep -i -E -q "${{ matrix.gui_says }}"
          if [ "$RUNNER_OS" = Linux ]; then
            # 只能直接相依 glibc：視窗、音訊的函式庫都是執行時才載入的，系統上沒有也要開得起來
            objdump -p "$gui" | grep NEEDED
            if objdump -p "$gui" | grep NEEDED | grep -v -E 'lib(c|m|dl|pthread|rt)\.so\.|ld-linux'; then
              echo "::error::nbtv-gui 直接相依了 glibc 以外的函式庫"
              exit 1
            fi
            echo "需要的 glibc 版本：$(objdump -T "$gui" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)"
          fi
          # 執行一次，把它寫進 --report 的內容印出來（沒有寫的話印標準輸出），結束碼照它的
          run() {
            local name="$1" status=0
            shift
            "$@" --report "$name.log" > "$name.out" 2>&1 || status=$?
            if [ -s "$name.log" ]; then cat "$name.log"; else cat "$name.out"; fi
            return $status
          }
          export SDL_AUDIODRIVER=dummy SDL_AUDIO_DRIVER=dummy
          run version "$gui" --version
          grep -q "nbtv-gui" version.log
          if [ "$RUNNER_OS" = Windows ]; then
            ffmpeg="./$PACKAGE/ffmpeg.exe"
            test -s "./$PACKAGE/FFMPEG-LICENSE.txt"
            file "$ffmpeg"
            file "$ffmpeg" | grep -i -E -q "${{ matrix.file_says }}"
            grep -E "ffmpeg：.*$PACKAGE[\\/]ffmpeg\.exe" version.log
            bash "$checker" "$ffmpeg" "$work/ffmpeg-check"
          fi
          NBTV_SELFTEST_REQUIRE=$require run selftest "$gui" --selftest --work "$work/selftest"
          NBTV_SNAPSHOT_FM=1 run snapshot "$gui" --snapshot "$GITHUB_WORKSPACE/screens" --lang all
          test -s "$GITHUB_WORKSPACE/screens/en/1-receiving.png"
          test -s "$GITHUB_WORKSPACE/screens/en/extra-fm-receiving.png"
          run demo $window "$gui" --demo --quit-after 3
          grep -q "畫了" demo.log
          NBTV_SNAPSHOT_FM=1 run demo-fm $window "$gui" --demo --quit-after 3
          grep -q "畫了" demo-fm.log
          run live $window "$gui" --settings "$work/settings.txt" --quit-after 5
          grep -q "畫了" live.log
          test -s "$work/settings.txt"

      - uses: actions/upload-artifact@v7
        if: runner.os != 'macOS' && !cancelled()
        with:
          name: screens-${{ matrix.target }}
          path: screens
          if-no-files-found: warn
          retention-days: 7

      # NBTV.app 也一樣：把壓縮檔解開到別的目錄，確認簽章還在，再跑 app 自己的檢查——模型、核心收發、存檔、
      # 影片來源、定時發射、翻譯……都不碰音訊裝置與鏡頭。
      - name: 解開 NBTV.app，跑它的自我測試
        if: runner.os == 'macOS'
        run: |
          work="$RUNNER_TEMP/app trial"
          mkdir -p "$work"
          ditto -x -k "dist/$PACKAGE-app.zip" "$work"
          codesign --verify --deep --strict --verbose=2 "$work/NBTV.app"
          "$work/NBTV.app/Contents/MacOS/NBTV" --selftest --no-devices

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # 推版本標籤時：把六個平台的下載包、Windows 的包裡那個 ffmpeg.exe 的原始碼，與一份 SHA-256 清單放上 GitHub Releases。
  release:
    name: release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: NBeeTv-*
          merge-multiple: true

      - name: SHA-256 清單
        run: |
          cd dist
          sha256sum NBeeTv-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 發佈
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "NBeeTv ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
          fi
